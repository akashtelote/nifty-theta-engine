name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: wheelbot
          POSTGRES_PASSWORD: securepassword
          POSTGRES_DB: wheeldb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Run tests
        env:
          DATABASE_URL: postgresql://wheelbot:securepassword@localhost:5432/wheeldb_test
          REDIS_URL: redis://localhost:6379/1
          PAPER_TRADE: "True"
          MOCK_MARKET: "True"
        run: uv run pytest tests/ -v --tb=short

      - name: Test coverage
        env:
          DATABASE_URL: postgresql://wheelbot:securepassword@localhost:5432/wheeldb_test
          REDIS_URL: redis://localhost:6379/1
          PAPER_TRADE: "True"
          MOCK_MARKET: "True"
        run: uv run pytest tests/ --cov=strategies --cov=core --cov-report=term-missing
