name: CI

# Runs on every branch, not just main. Main is written only by the merge job below,
# and pushes made with GITHUB_TOKEN never trigger workflows — so a main-only trigger
# meant CI fired for nothing between 2026-08-02 and 2026-08-06 while main went red.
on:
  push:
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: wheelbot
          POSTGRES_PASSWORD: securepassword
          POSTGRES_DB: wheeldb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Run tests
        env:
          DATABASE_URL: postgresql://wheelbot:securepassword@localhost:5432/wheeldb_test
          REDIS_URL: redis://localhost:6379/1
          PAPER_TRADE: "True"
          MOCK_MARKET: "True"
        run: uv run pytest tests/ -v --tb=short --cov=strategies --cov=core --cov-report=term-missing

  merge-to-main:
    # Was a separate auto-merge.yml triggered on push, which merged to main without
    # waiting for anything — a merge gate that did not gate. As a needs: edge it
    # cannot run unless lint-and-test is green.
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the merge has a real base

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge current branch into main
        run: |
          git checkout main
          git merge ${{ github.ref_name }} --no-ff --commit -m "Auto-merge branch ${{ github.ref_name }} to main"
          git push origin main
